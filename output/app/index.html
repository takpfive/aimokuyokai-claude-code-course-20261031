<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問い合わせ管理</title>
<style>
  :root {
    --green: #1f4d3a;
    --green-soft: #e3ebe2;
    --cream: #f6f1e4;
    --paper: #fffdf7;
    --ink: #1f2a24;
    --muted: #5b6660;
    --line: #d9d2bf;
    --alert: #9a3b2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 24px 80px; }
  h1 { margin: 0 0 8px; font-size: 32px; color: var(--green); letter-spacing: .04em; }
  .base-date { margin: 0 0 48px; color: var(--muted); }
  h2 { font-size: 18px; color: var(--green); margin: 0 0 16px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin: 0 0 56px;
    padding: 0;
    list-style: none;
    border-top: 2px solid var(--green);
    border-bottom: 1px solid var(--line);
  }
  .stats li { padding: 24px 20px; }
  .stats li + li { border-left: 1px solid var(--line); }
  .stats .label { display: block; font-size: 14px; color: var(--muted); }
  .stats .num { display: block; font-size: 44px; font-weight: 700; color: var(--green); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stats .overdue .num { color: var(--alert); }

  .controls { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; margin-bottom: 24px; }
  .controls label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  input[type="search"], select {
    font: inherit; color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    min-height: 42px;
  }
  input[type="search"] { width: 260px; max-width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible, .file-btn:focus-within {
    outline: 3px solid #7fa58f; outline-offset: 2px;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 40px; }
  button, .file-btn {
    font: inherit; font-size: 15px;
    border-radius: 6px;
    padding: 9px 18px;
    min-height: 42px;
    cursor: pointer;
    border: 1px solid var(--green);
    background: var(--paper);
    color: var(--green);
  }
  .file-btn { display: inline-flex; align-items: center; }
  .file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  button.primary { background: var(--green); color: var(--paper); }
  button.quiet { border-color: var(--line); color: var(--muted); }

  .message { min-height: 1.7em; margin: -24px 0 24px; color: var(--green); }
  .message.error { color: var(--alert); }

  .count { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--green-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td.id, td.date { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.topic { word-break: break-word; }
  .tag { display: inline-block; margin-left: 8px; padding: 0 8px; font-size: 12px; border-radius: 4px; color: var(--paper); background: var(--alert); white-space: nowrap; }
  tr.done td { color: var(--muted); }
  td select { min-height: 36px; padding: 4px 8px; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    main { padding: 32px 16px 56px; }
    h1 { font-size: 26px; }
    .base-date { margin-bottom: 32px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stats li:nth-child(3) { border-left: none; }
    .stats li:nth-child(n+3) { border-top: 1px solid var(--line); }
    .stats .num { font-size: 36px; }
    input[type="search"] { width: 100%; }
    .controls label:first-child { flex-basis: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>問い合わせ管理</h1>
  <p class="base-date">基準日 2026-10-29</p>

  <ul class="stats" aria-label="件数">
    <li><span class="label">未対応</span><span class="num" id="stat-open">0</span></li>
    <li><span class="label">対応中</span><span class="num" id="stat-doing">0</span></li>
    <li><span class="label">完了</span><span class="num" id="stat-done">0</span></li>
    <li class="overdue"><span class="label">期限超過（未完了）</span><span class="num" id="stat-overdue">0</span></li>
  </ul>

  <h2>一覧</h2>
  <div class="controls">
    <label>会社名・件名で検索
      <input type="search" id="q" placeholder="例：そら商事、見積">
    </label>
    <label>状態
      <select id="f-status">
        <option value="">すべて</option>
        <option>未対応</option>
        <option>対応中</option>
        <option>完了</option>
      </select>
    </label>
    <label>優先度
      <select id="f-priority">
        <option value="">すべて</option>
        <option>高</option>
        <option>中</option>
        <option>低</option>
      </select>
    </label>
  </div>

  <div class="actions">
    <label class="file-btn">CSVを読み込む<input type="file" id="import" accept=".csv,text/csv"></label>
    <button type="button" class="primary" id="download">CSVをダウンロード</button>
    <button type="button" class="quiet" id="reset">教材リセット</button>
  </div>
  <p class="message" id="message" role="status" aria-live="polite"></p>

  <p class="count" id="count"></p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>受付日</th><th>会社名</th><th>件名</th><th>優先度</th><th>期限</th><th>状態</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
const BASE_DATE = '2026-10-29';
const STORAGE_KEY = 'inquiry-manager-v1';
const COLUMNS = ['id', 'received', 'company', 'topic', 'priority', 'due', 'status'];
const STATUSES = ['未対応', '対応中', '完了'];
const PRIORITIES = ['高', '中', '低'];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

const INITIAL_CSV = `id,received,company,topic,priority,due,status
R01,2026-10-20,そら商事,AI研修の見積,高,2026-10-29,未対応
R02,2026-10-21,つき企画,資料再送,中,2026-10-30,対応中
R03,2026-10-22,ほし工房,領収書の発行,中,2026-10-28,未対応
R04,2026-10-22,にじ社,日程の相談,低,2026-11-04,未対応
R05,2026-10-23,もり社,録画リンク,高,2026-10-29,完了
R06,2026-10-24,うみ社,受講人数の変更,高,2026-10-30,対応中
R07,2026-10-25,かぜ社,講師候補の相談,低,2026-11-06,未対応
R08,2026-10-26,はな社,請求先の確認,中,2026-10-31,未対応`;

// RFC 4180: quoted fields may contain commas, CR/LF and "" for a literal quote.
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function toRecords(rows) {
  if (!rows.length) return { error: 'CSVが空です。' };
  const header = rows[0].map(h => h.trim());
  const missing = COLUMNS.filter(c => !header.includes(c));
  if (missing.length) return { error: `列が足りません: ${missing.join(', ')}` };
  const records = [];
  let skipped = 0;
  for (const r of rows.slice(1)) {
    const rec = {};
    COLUMNS.forEach(c => { rec[c] = (r[header.indexOf(c)] ?? '').trim(); });
    if (isValid(rec)) records.push(rec); else skipped++;
  }
  return { records, skipped };
}

function isValid(r) {
  return r && typeof r.id === 'string' && r.id !== ''
    && STATUSES.includes(r.status) && PRIORITIES.includes(r.priority)
    && DATE_RE.test(r.received) && DATE_RE.test(r.due)
    && typeof r.company === 'string' && typeof r.topic === 'string';
}

function toCSV(records) {
  const esc = v => /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  return [COLUMNS.join(','), ...records.map(r => COLUMNS.map(c => esc(String(r[c]))).join(','))].join('\r\n') + '\r\n';
}

function isOverdue(r) {
  return r.status !== '完了' && r.due < BASE_DATE;
}

function initialRecords() {
  return toRecords(parseCSV(INITIAL_CSV)).records;
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length && saved.every(isValid)) return saved;
  } catch (e) { /* 保存データが壊れていれば初期データを使う */ }
  return initialRecords();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  catch (e) { say('ブラウザに保存できませんでした。再読み込みすると変更は消えます。', true); }
}

let records = load();
const $ = id => document.getElementById(id);

function say(text, isError = false) {
  $('message').textContent = text;
  $('message').classList.toggle('error', isError);
}

function cell(text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function render() {
  $('stat-open').textContent = records.filter(r => r.status === '未対応').length;
  $('stat-doing').textContent = records.filter(r => r.status === '対応中').length;
  $('stat-done').textContent = records.filter(r => r.status === '完了').length;
  $('stat-overdue').textContent = records.filter(isOverdue).length;

  const q = $('q').value.trim().toLowerCase();
  const fs = $('f-status').value;
  const fp = $('f-priority').value;
  const shown = records.filter(r =>
    (!q || r.company.toLowerCase().includes(q) || r.topic.toLowerCase().includes(q))
    && (!fs || r.status === fs)
    && (!fp || r.priority === fp));

  $('count').textContent = `表示 ${shown.length}件 / 全${records.length}件`;
  const tbody = $('rows');
  tbody.replaceChildren();
  if (!shown.length) {
    const td = cell('条件に合う問い合わせはありません。', 'empty');
    td.colSpan = COLUMNS.length;
    tbody.append(document.createElement('tr'));
    tbody.lastChild.append(td);
    return;
  }
  for (const r of shown) {
    const tr = document.createElement('tr');
    tr.dataset.id = r.id;
    if (r.status === '完了') tr.className = 'done';
    const due = cell(r.due, 'date');
    if (isOverdue(r)) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '期限超過';
      due.append(tag);
    }
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', `${r.id}の状態`);
    for (const s of STATUSES) sel.add(new Option(s, s, false, s === r.status));
    sel.addEventListener('change', () => {
      r.status = sel.value;
      save();
      render();
      say(`${r.id} を「${r.status}」に変更しました。`);
    });
    const st = document.createElement('td');
    st.append(sel);
    tr.append(cell(r.id, 'id'), cell(r.received, 'date'), cell(r.company), cell(r.topic, 'topic'),
      cell(r.priority), due, st);
    tbody.append(tr);
  }
}

function importCSV(text) {
  const result = toRecords(parseCSV(text));
  if (result.error) { say(result.error, true); return; }
  let added = 0, updated = 0;
  for (const rec of result.records) {
    const i = records.findIndex(r => r.id === rec.id);
    if (i >= 0) { records[i] = rec; updated++; } else { records.push(rec); added++; }
  }
  save();
  render();
  const skip = result.skipped ? `・形式不正で${result.skipped}件スキップ` : '';
  say(`CSVを読み込みました（追加${added}件・更新${updated}件${skip}）。`, result.skipped > 0);
}

$('q').addEventListener('input', render);
$('f-status').addEventListener('change', render);
$('f-priority').addEventListener('change', render);

$('import').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(importCSV, () => say('ファイルを読めませんでした。', true));
  e.target.value = '';
});

$('download').addEventListener('click', () => {
  const blob = new Blob(['﻿' + toCSV(records)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'requests.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('reset').addEventListener('click', () => {
  if (!confirm('教材の初期データ8件に戻します。状態の変更と読み込んだCSVは消えます。よろしいですか？')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 保存できない環境でも画面は戻す */ }
  records = initialRecords();
  $('q').value = '';
  $('f-status').value = '';
  $('f-priority').value = '';
  render();
  say('初期データに戻しました。');
});

render();
</script>
</body>
</html>
